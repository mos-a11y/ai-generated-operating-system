name: Cloud Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XFCE + VNC + noVNC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xfce4 xfce4-goodies tigervnc-standalone-server novnc websockify curl
          mkdir -p "$HOME/.vnc"
          echo "123456" | vncpasswd -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"
          printf '#!/bin/sh\nxrdb $HOME/.Xresources\nstartxfce4 &\n' > "$HOME/.vnc/xstartup"
          chmod +x "$HOME/.vnc/xstartup"

      - name: Start VNC
        run: |
          vncserver :1 -geometry 1280x800 -depth 24 || true
          sleep 3
          nohup websockify --web=/usr/share/novnc 6080 localhost:5901 > /tmp/ws.log 2>&1 &

      - name: Expose via tunnel
        run: |
          mkdir -p .vm-output
          echo "" > .vm-output/desktop-url.txt
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cf || true
          chmod +x /tmp/cf 2>/dev/null || true
          if [ -s /tmp/cf ]; then
            nohup /tmp/cf tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 &
            sleep 25
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            echo "$URL" > .vm-output/desktop-url.txt
            echo "CLOUDFLARE_URL=$URL"
          fi
          if [ ! -s .vm-output/desktop-url.txt ]; then
            nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
              -R 80:localhost:6080 serveo.net > /tmp/sv.log 2>&1 &
            sleep 20
            URL=$(grep -oE 'https://[a-z0-9]+\.serveo\.net' /tmp/sv.log | head -1)
            echo "$URL" > .vm-output/desktop-url.txt
          fi
          if [ ! -s .vm-output/desktop-url.txt ]; then
            echo "TUNNEL_FAILED" > .vm-output/desktop-url.txt
          fi
          cat .vm-output/desktop-url.txt

      - name: Save URL
        run: |
          git config user.name "cloud-desktop"
          git config user.email "desktop@users.noreply.github.com"
          git add -f .vm-output/desktop-url.txt
          git diff --staged --quiet || git commit -m "desktop url"
          for i in 1 2 3; do git push && break || sleep 3; done
          exit 0

      - name: Keep alive
        run: |
          echo "desktop running max 6h"
          for i in $(seq 1 350); do sleep 60; done
