name: Cloud Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install desktop stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb x11vnc xfce4 xfce4-goodies novnc websockify netcat-openbsd curl
          mkdir -p .vm-output
          echo "installed" > .vm-output/diag.txt

      - name: Start Xvfb + XFCE + x11vnc + websockify
        run: |
          mkdir -p .vm-output
          # 1) 虚拟显示器
          setsid nohup Xvfb :1 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 < /dev/null &
          sleep 4
          # 2) 桌面环境
          DISPLAY=:1 setsid nohup startxfce4 > /tmp/xfce.log 2>&1 < /dev/null &
          sleep 8
          # 3) VNC 服务（x11vnc 比 tigervnc 稳，且直接共享真实 DISPLAY）
          mkdir -p "$HOME/.vnc"
          x11vnc -storepasswd 123456 "$HOME/.vnc/passwd" > /dev/null 2>&1
          setsid nohup x11vnc -display :1 -forever -shared -rfbauth "$HOME/.vnc/passwd" \
            -rfbport 5901 -noxdamage > /tmp/x11vnc.log 2>&1 < /dev/null &
          sleep 5
          # 4) WebSocket 桥接（noVNC 走它）
          WEBDIR=/usr/share/novnc
          [ -d "$WEBDIR" ] || WEBDIR=""
          if [ -n "$WEBDIR" ]; then
            setsid nohup websockify --web="$WEBDIR" 6080 localhost:5901 > /tmp/ws.log 2>&1 < /dev/null &
          else
            setsid nohup websockify 6080 localhost:5901 > /tmp/ws.log 2>&1 < /dev/null &
          fi
          sleep 5
          # 5) 健康检查写入诊断文件
          {
            echo "Xvfb:    $(pgrep -f 'Xvfb :1' >/dev/null && echo OK || echo FAIL)"
            echo "XFCE:    $(pgrep -f startxfce4 >/dev/null && echo OK || echo FAIL)"
            echo "x11vnc:  $(pgrep -f x11vnc >/dev/null && echo OK || echo FAIL)"
            echo "websock: $(pgrep -f websockify >/dev/null && echo OK || echo FAIL)"
            echo "5901:    $(nc -z -w2 127.0.0.1 5901 && echo LISTEN || echo DOWN)"
            echo "6080:    $(nc -z -w2 127.0.0.1 6080 && echo LISTEN || echo DOWN)"
            echo "http6080:$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/vnc.html)"
          } > .vm-output/diag.txt
          cat .vm-output/diag.txt

      - name: Expose via cloudflared tunnel
        run: |
          mkdir -p .vm-output
          echo "" > .vm-output/desktop-url.txt
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cf || true
          chmod +x /tmp/cf 2>/dev/null || true
          if [ -s /tmp/cf ]; then
            setsid nohup /tmp/cf tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 < /dev/null &
            sleep 30
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            echo "$URL" > .vm-output/desktop-url.txt
          fi
          if [ ! -s .vm-output/desktop-url.txt ]; then
            nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
              -R 80:localhost:6080 serveo.net > /tmp/sv.log 2>&1 &
            sleep 20
            URL=$(grep -oE 'https://[a-z0-9]+\.serveo\.net' /tmp/sv.log | head -1)
            echo "$URL" > .vm-output/desktop-url.txt
          fi
          [ -s .vm-output/desktop-url.txt ] || echo "TUNNEL_FAILED" > .vm-output/desktop-url.txt
          echo "URL=$(cat .vm-output/desktop-url.txt)"

      - name: Commit status
        run: |
          git config user.name "cloud-desktop"
          git config user.email "desktop@users.noreply.github.com"
          git add -f .vm-output/desktop-url.txt .vm-output/diag.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "desktop status"
          for i in 1 2 3; do git push && break || sleep 3; done
          exit 0

      - name: Keep alive
        run: |
          # 每 60 秒刷新一次诊断，方便排查
          for i in $(seq 1 340); do
            {
              echo "tick $i"
              echo "5901: $(nc -z -w2 127.0.0.1 5901 && echo LISTEN || echo DOWN)"
              echo "6080: $(nc -z -w2 127.0.0.1 6080 && echo LISTEN || echo DOWN)"
            } > /tmp/beat.txt
            sleep 60
          done
