name: Cloud Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install desktop stack + Chinese
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq locales
          sudo locale-gen zh_CN.UTF-8
          sudo update-locale LANG=zh_CN.UTF-8
          sudo apt-get install -y -qq \
            language-pack-zh-hans fonts-wqy-zenhei fonts-wqy-microhei \
            xvfb x11vnc xfce4 xfce4-goodies xterm novnc websockify \
            netcat-openbsd curl dbus-x11
          mkdir -p .vm-output
          sudo rm -rf /opt/novnc
          (sudo git clone --depth 1 https://github.com/novnc/noVNC.git /opt/novnc) > /dev/null 2>&1
          if [ ! -f /opt/novnc/vnc.html ]; then
            curl -sL https://github.com/novnc/noVNC/archive/refs/heads/master.tar.gz -o /tmp/nv.tgz > /dev/null 2>&1
            sudo mkdir -p /opt/novnc
            sudo tar xzf /tmp/nv.tgz -C /opt/novnc --strip-components=1 > /dev/null 2>&1
          fi
          sudo chmod -R 755 /opt/novnc 2>/dev/null
          echo "installed" > .vm-output/diag.txt
          exit 0

      - name: Install Firefox (optional, non-fatal)
        run: |
          set +e
          # Ubuntu 的 apt firefox 是 snap 壳，在容器里打不开；改用 Mozilla 官方中文版
          sudo rm -rf /opt/firefox
          timeout 180 curl -sL "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=zh-CN" -o /tmp/ff.tar.xz
          if [ -s /tmp/ff.tar.xz ]; then
            sudo mkdir -p /opt
            sudo tar xJf /tmp/ff.tar.xz -C /opt/ > /dev/null 2>&1
          fi
          ls /opt/firefox/firefox > /dev/null 2>&1 && echo "FF=OK" || echo "FF=MISSING"
          exit 0

      - name: Start Xvfb + XFCE + x11vnc + websockify
        run: |
          set +e
          mkdir -p .vm-output
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          export LANGUAGE=zh_CN:zh
          export DISPLAY=:1
          # 分辨率调小，手机上不用划来划去
          setsid nohup Xvfb :1 -screen 0 1024x640x24 > /tmp/xvfb.log 2>&1 < /dev/null &
          sleep 4
          dbus-daemon --session --address=unix:path=/tmp/dbus-sock --fork --print-address > /dev/null 2>&1
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/dbus-sock
          setsid nohup dbus-launch --exit-with-session xfce4-session > /tmp/xfce.log 2>&1 < /dev/null &
          sleep 12
          pgrep -f "xfdesktop|xfwm4|xfce4-session" > /dev/null || { setsid nohup startxfce4 > /tmp/xfce2.log 2>&1 < /dev/null & sleep 10; }
          pgrep -f "xfdesktop|xfwm4" > /dev/null || { setsid nohup xterm -geometry 100x30 > /tmp/xterm.log 2>&1 < /dev/null & sleep 3; }

          mkdir -p "$HOME/Desktop"
          chmod +x "$HOME/Desktop" 2>/dev/null
          FF=""
          [ -x /opt/firefox/firefox ] && FF=/opt/firefox/firefox
          [ -z "$FF" ] && [ -x /usr/bin/firefox ] && FF=/usr/bin/firefox
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Firefox\nName[zh_CN]=Firefox\nExec=%s\nIcon=firefox\nTerminal=false\nCategories=Network;\n' "${FF:-firefox}" > "$HOME/Desktop/firefox.desktop"
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Terminal\nName[zh_CN]=Terminal\nExec=xfce4-terminal\nIcon=utilities-terminal\nTerminal=false\nCategories=System;\n' > "$HOME/Desktop/terminal.desktop"
          printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Files\nName[zh_CN]=Files\nExec=thunar\nIcon=org.xfce.thunar\nTerminal=false\nCategories=System;\n' > "$HOME/Desktop/files.desktop"
          chmod 755 "$HOME/Desktop"/*.desktop
          gio set "$HOME/Desktop"/*.desktop metadata::xfce-exe-checksum "*" 2>/dev/null

          mkdir -p "$HOME/.vnc"
          x11vnc -storepasswd 123456 "$HOME/.vnc/passwd" > /dev/null 2>&1
          setsid nohup x11vnc -display :1 -forever -shared -rfbauth "$HOME/.vnc/passwd" -rfbport 5901 -noxdamage -threads > /tmp/x11vnc.log 2>&1 < /dev/null &
          sleep 5
          WEBROOT=""
          [ -f /opt/novnc/vnc.html ] && WEBROOT=/opt/novnc
          [ -z "$WEBROOT" ] && [ -f /usr/share/novnc/vnc.html ] && WEBROOT=/usr/share/novnc
          if [ -n "$WEBROOT" ]; then
            setsid nohup websockify --web="$WEBROOT" --heartbeat 30 6080 localhost:5901 > /tmp/ws.log 2>&1 < /dev/null &
          else
            setsid nohup websockify --heartbeat 30 6080 localhost:5901 > /tmp/ws.log 2>&1 < /dev/null &
          fi
          sleep 5
          RFB=$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/5901; head -c 12 <&3' 2>/dev/null | tr -cd '[:print:]')
          {
            echo "LANG:     ${LANG}"
            echo "Xvfb:     $(pgrep -f 'Xvfb :1' >/dev/null && echo OK || echo FAIL)"
            echo "XFCE:     $(pgrep -f 'xfdesktop|xfwm4|xfce4-session' >/dev/null && echo OK || echo FAIL)"
            echo "x11vnc:   $(pgrep -f x11vnc >/dev/null && echo OK || echo FAIL)"
            echo "websock:  $(pgrep -f websockify >/dev/null && echo OK || echo FAIL)"
            echo "FIREFOX:  ${FF:-NONE}"
            echo "WEBROOT:  ${WEBROOT:-NONE}"
            echo "5901:     $(nc -z -w2 127.0.0.1 5901 && echo LISTEN || echo DOWN)"
            echo "6080:     $(nc -z -w2 127.0.0.1 6080 && echo LISTEN || echo DOWN)"
            echo "RFB:      ${RFB:-EMPTY}"
            echo "http6080: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/vnc.html)"
            echo "rootcode: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/)"
          } > .vm-output/diag.txt
          cat .vm-output/diag.txt
          exit 0

      - name: Expose via cloudflared tunnel
        run: |
          set +e
          mkdir -p .vm-output
          echo "" > .vm-output/desktop-url.txt
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cf > /dev/null 2>&1
          chmod +x /tmp/cf 2>/dev/null
          if [ -s /tmp/cf ]; then
            setsid nohup /tmp/cf tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 < /dev/null &
            for i in $(seq 1 20); do
              sleep 3
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1)
              [ -n "$URL" ] && break
            done
            [ -n "$URL" ] && echo "$URL" > .vm-output/desktop-url.txt
          fi
          if [ ! -s .vm-output/desktop-url.txt ]; then
            nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:localhost:6080 serveo.net > /tmp/sv.log 2>&1 &
            sleep 20
            URL2=$(grep -oE 'https://[a-z0-9]+\.serveo\.net' /tmp/sv.log 2>/dev/null | head -1)
            [ -n "$URL2" ] && echo "$URL2" > .vm-output/desktop-url.txt
          fi
          [ -s .vm-output/desktop-url.txt ] || echo "TUNNEL_FAILED" > .vm-output/desktop-url.txt
          echo "URL=$(cat .vm-output/desktop-url.txt)"
          exit 0

      - name: Commit status
        run: |
          set +e
          git config user.name "cloud-desktop"
          git config user.email "desktop@users.noreply.github.com"
          git add -f .vm-output/
          git diff --staged --quiet || git commit -m "desktop status"
          for i in 1 2 3; do git push && break || sleep 3; done
          exit 0

      - name: Keep alive
        run: |
          for i in $(seq 1 170); do sleep 60; done
