name: Cloud Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install core desktop (keep it small and fast)
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            locales language-pack-zh-hans fonts-wqy-microhei fonts-wqy-zenhei \
            xvfb x11vnc xfce4 xfce4-goodies xterm novnc websockify \
            netcat-openbsd curl dbus-x11
          sudo locale-gen zh_CN.UTF-8 2>&1 | tail -2
          mkdir -p .vm-output
          sudo rm -rf /opt/novnc
          (sudo git clone --depth 1 https://github.com/novnc/noVNC.git /opt/novnc) > /dev/null 2>&1
          if [ ! -f /opt/novnc/vnc.html ]; then
            curl -sL https://github.com/novnc/noVNC/archive/refs/heads/master.tar.gz -o /tmp/nv.tgz > /dev/null 2>&1
            sudo mkdir -p /opt/novnc
            sudo tar xzf /tmp/nv.tgz -C /opt/novnc --strip-components=1 > /dev/null 2>&1
          fi
          sudo chmod -R 755 /opt/novnc 2>/dev/null
          echo "installed" > .vm-output/diag.txt
          exit 0

      - name: Start Xvfb + XFCE + x11vnc + websockify
        run: |
          set +e
          mkdir -p .vm-output
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          export LANGUAGE=zh_CN:zh
          export DISPLAY=:1
          setsid nohup Xvfb :1 -screen 0 1280x800x24 > /tmp/xvfb.log 2>&1 < /dev/null &
          sleep 4
          dbus-daemon --session --address=unix:path=/tmp/dbus-sock --fork --print-address > /dev/null 2>&1
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/dbus-sock
          setsid nohup dbus-launch --exit-with-session xfce4-session > /tmp/xfce.log 2>&1 < /dev/null &
          sleep 12
          pgrep -f "xfdesktop|xfwm4|xfce4-session" > /dev/null || { setsid nohup startxfce4 > /tmp/xfce2.log 2>&1 < /dev/null & sleep 10; }
          pgrep -f "xfdesktop|xfwm4" > /dev/null || { setsid nohup xterm -geometry 100x30 > /tmp/xterm.log 2>&1 < /dev/null & sleep 3; }
          mkdir -p "$HOME/.vnc"
          x11vnc -storepasswd 123456 "$HOME/.vnc/passwd" > /dev/null 2>&1
          setsid nohup x11vnc -display :1 -forever -shared -rfbauth "$HOME/.vnc/passwd" -rfbport 5901 -noxdamage -threads > /tmp/x11vnc.log 2>&1 < /dev/null &
          sleep 5
          WEBROOT=""
          [ -f /opt/novnc/vnc.html ] && WEBROOT=/opt/novnc
          [ -z "$WEBROOT" ] && [ -f /usr/share/novnc/vnc.html ] && WEBROOT=/usr/share/novnc
          if [ -n "$WEBROOT" ]; then
            setsid nohup websockify --web="$WEBROOT" --heartbeat 30 6080 localhost:5901 > /tmp/ws.log 2>&1 < /dev/null &
          else
            setsid nohup websockify --heartbeat 30 6080 localhost:5901 > /tmp/ws.log 2>&1 < /dev/null &
          fi
          sleep 5
          RFB=$(timeout 5 bash -c 'exec 3<>/dev/tcp/127.0.0.1/5901; head -c 12 <&3' 2>/dev/null | tr -cd '[:print:]')
          {
            echo "LANG:     ${LANG:-unset}"

            echo "Xvfb:     $(pgrep -f 'Xvfb :1' >/dev/null && echo OK || echo FAIL)"
            echo "XFCE:     $(pgrep -f 'xfdesktop|xfwm4|xfce4-session' >/dev/null && echo OK || echo FAIL)"
            echo "x11vnc:   $(pgrep -f x11vnc >/dev/null && echo OK || echo FAIL)"
            echo "websock:  $(pgrep -f websockify >/dev/null && echo OK || echo FAIL)"
            echo "WEBROOT:  ${WEBROOT:-NONE}"
            echo "5901:     $(nc -z -w2 127.0.0.1 5901 && echo LISTEN || echo DOWN)"
            echo "6080:     $(nc -z -w2 127.0.0.1 6080 && echo LISTEN || echo DOWN)"
            echo "RFB:      ${RFB:-EMPTY}"
            echo "http6080: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/vnc.html)"
            echo "rootcode: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:6080/)"
          } > .vm-output/diag.txt
          cat .vm-output/diag.txt
          exit 0

      - name: Expose via cloudflared tunnel
        run: |
          set +e
          mkdir -p .vm-output
          echo "" > .vm-output/desktop-url.txt
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cf > /dev/null 2>&1
          chmod +x /tmp/cf 2>/dev/null
          if [ -s /tmp/cf ]; then
            setsid nohup /tmp/cf tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf.log 2>&1 < /dev/null &
            for i in $(seq 1 20); do
              sleep 3
              URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1)
              [ -n "$URL" ] && break
            done
            [ -n "$URL" ] && echo "$URL" > .vm-output/desktop-url.txt
          fi
          if [ ! -s .vm-output/desktop-url.txt ]; then
            nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 80:localhost:6080 serveo.net > /tmp/sv.log 2>&1 &
            sleep 20
            URL2=$(grep -oE 'https://[a-z0-9]+\.serveo\.net' /tmp/sv.log 2>/dev/null | head -1)
            [ -n "$URL2" ] && echo "$URL2" > .vm-output/desktop-url.txt
          fi
          [ -s .vm-output/desktop-url.txt ] || echo "TUNNEL_FAILED" > .vm-output/desktop-url.txt
          echo "URL=$(cat .vm-output/desktop-url.txt)"
          exit 0

      - name: Commit status
        run: |
          set +e
          git config user.name "cloud-desktop"
          git config user.email "desktop@users.noreply.github.com"
          git add -f .vm-output/
          git diff --staged --quiet || git commit -m "desktop status"
          for i in 1 2 3; do git push && break || sleep 3; done
          exit 0

      - name: Install Chinese + Firefox in background (non-blocking)
        run: |
          set +e
          {
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get install -y -qq locales language-pack-zh-hans \
              fonts-wqy-zenhei fonts-wqy-microhei xfce4-l10n thunar-l10n 2>&1 | tail -3
            sudo locale-gen zh_CN.UTF-8 2>&1 | tail -2
            # Firefox 官方中文版（apt 的是 snap 壳，容器里打不开）
            sudo rm -rf /opt/firefox
            timeout 240 curl -sL "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=zh-CN" -o /tmp/ff.tar.xz
            if [ -s /tmp/ff.tar.xz ]; then
              sudo mkdir -p /opt
              sudo tar xJf /tmp/ff.tar.xz -C /opt/ 2>&1 | tail -2
            fi
            # 桌面图标
            mkdir -p "$HOME/Desktop"
            FF=""
            [ -x /opt/firefox/firefox ] && FF=/opt/firefox/firefox
            [ -z "$FF" ] && [ -x /usr/bin/firefox ] && FF=/usr/bin/firefox
            printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Firefox\nName[zh_CN]=Firefox\nExec=%s\nIcon=firefox\nTerminal=false\nCategories=Network;\n' "${FF:-firefox}" > "$HOME/Desktop/firefox.desktop"
            printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Terminal\nName[zh_CN]=Terminal\nExec=xfce4-terminal\nIcon=utilities-terminal\nTerminal=false\nCategories=System;\n' > "$HOME/Desktop/terminal.desktop"
            printf '[Desktop Entry]\nVersion=1.0\nType=Application\nName=Files\nName[zh_CN]=Files\nExec=thunar\nIcon=org.xfce.thunar\nTerminal=false\nCategories=System;\n' > "$HOME/Desktop/files.desktop"
            chmod 755 "$HOME/Desktop"/*.desktop
            gio set "$HOME/Desktop"/*.desktop metadata::xfce-exe-checksum "*" 2>/dev/null
            echo "EXTRA_DONE FF=${FF:-NONE}"
          } > /tmp/extra.log 2>&1
          cat /tmp/extra.log | tail -20
          exit 0

      - name: Keep alive
        run: |
          set +e
          mkdir -p .vm-output
          git config user.name "cloud-desktop"
          git config user.email "desktop@users.noreply.github.com"

          start_tunnels() {
            pkill -f cloudflared >/dev/null 2>&1
            pkill -f "a.pinggy.io" >/dev/null 2>&1
            pkill -f "localhost.run" >/dev/null 2>&1
            pkill -f "serveo.net" >/dev/null 2>&1
            sleep 2
            : > .vm-output/tunnels.txt
            [ -s /tmp/cf ] || curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cf >/dev/null 2>&1
            chmod +x /tmp/cf 2>/dev/null
            if [ -s /tmp/cf ]; then
              setsid nohup /tmp/cf tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cf2.log 2>&1 < /dev/null &
              for i in $(seq 1 15); do
                sleep 4
                U=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf2.log 2>/dev/null | head -1)
                [ -n "$U" ] && echo "cloudflared=$U" >> .vm-output/tunnels.txt && break
              done
            fi
            setsid nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:6080 a.pinggy.io > /tmp/pg.log 2>&1 < /dev/null &
            for i in $(seq 1 12); do
              sleep 4
              U=$(grep -oE 'https://[A-Za-z0-9._-]*pinggy[A-Za-z0-9._-]*' /tmp/pg.log 2>/dev/null | head -1)
              [ -n "$U" ] && echo "pinggy=$U" >> .vm-output/tunnels.txt && break
            done
            setsid nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:localhost:6080 nokey@localhost.run > /tmp/lr.log 2>&1 < /dev/null &
            for i in $(seq 1 12); do
              sleep 4
              U=$(grep -oE 'https://[A-Za-z0-9._-]+\.(lhr\.life|localhost\.run)' /tmp/lr.log 2>/dev/null | head -1)
              [ -n "$U" ] && echo "localhostrun=$U" >> .vm-output/tunnels.txt && break
            done
            setsid nohup ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 80:localhost:6080 serveo.net > /tmp/sv2.log 2>&1 < /dev/null &
            for i in $(seq 1 8); do
              sleep 4
              U=$(grep -oE 'https://[A-Za-z0-9-]+\.serveo\.net' /tmp/sv2.log 2>/dev/null | head -1)
              [ -n "$U" ] && echo "serveo=$U" >> .vm-output/tunnels.txt && break
            done
          }

          commit_out() {
            git add -f .vm-output/ >/dev/null 2>&1
            git diff --staged --quiet && return 0
            git commit -m "vm status" >/dev/null 2>&1
            git push --force >/dev/null 2>&1 || { git pull --rebase -X ours >/dev/null 2>&1; git push --force >/dev/null 2>&1; }
          }

          # 保证桌面 + 中文 + Firefox 都活着（放在本步骤里才不会被步骤结束时清理）
          export DISPLAY=:1
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/dbus-sock
          export LANG=zh_CN.UTF-8
          export LC_ALL=zh_CN.UTF-8
          export LANGUAGE=zh_CN:zh
          pgrep -f 'Xvfb :1' >/dev/null || { setsid nohup Xvfb :1 -screen 0 1280x800x24 > /tmp/xvfb2.log 2>&1 < /dev/null & sleep 4; }
          pgrep -f 'xfdesktop|xfwm4' >/dev/null || { setsid nohup startxfce4 > /tmp/xfce3.log 2>&1 < /dev/null & sleep 12; }
          pgrep -f x11vnc >/dev/null || { mkdir -p "$HOME/.vnc"; x11vnc -storepasswd 123456 "$HOME/.vnc/passwd" >/dev/null 2>&1; setsid nohup x11vnc -display :1 -forever -shared -rfbauth "$HOME/.vnc/passwd" -rfbport 5901 -noxdamage -threads > /tmp/x11vnc2.log 2>&1 < /dev/null & sleep 5; }
          pgrep -f websockify >/dev/null || { WEBROOT=/opt/novnc; [ -f /opt/novnc/vnc.html ] || WEBROOT=/usr/share/novnc; setsid nohup websockify --web=$WEBROOT --heartbeat 30 6080 localhost:5901 > /tmp/ws2.log 2>&1 < /dev/null & sleep 5; }
          pkill -f xfdesktop >/dev/null 2>&1; sleep 2
          setsid nohup xfdesktop --display=:1 > /tmp/xfdesktop3.log 2>&1 < /dev/null &
          sleep 5
          FF=""
          [ -x /opt/firefox/firefox ] && FF=/opt/firefox/firefox
          [ -z "$FF" ] && [ -x /usr/bin/firefox ] && FF=/usr/bin/firefox
          if [ -n "$FF" ]; then
            export MOZ_DISABLE_CONTENT_SANDBOX=1
            setsid nohup "$FF" --display=:1 about:blank > /tmp/ff-run.log 2>&1 < /dev/null &
            sleep 10
          fi
          echo "FF=$FF" > .vm-output/ff.txt

          start_tunnels
          commit_out
          LAST=""
          for i in $(seq 1 155); do
            OK=""
            while IFS='=' read -r N U; do
              [ -z "$U" ] && continue
              C=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "$U/vnc.html")
              [ "$C" = "200" ] && { OK="$U"; break; }
            done < .vm-output/tunnels.txt 2>/dev/null
            if [ -z "$OK" ]; then
              start_tunnels
              sleep 5
              OK=$(head -1 .vm-output/tunnels.txt 2>/dev/null | cut -d= -f2-)
            fi
            if [ -n "$OK" ] && [ "$OK" != "$LAST" ]; then
              echo "$OK" > .vm-output/desktop-url.txt
              echo "url switched -> $OK"
              commit_out
              LAST="$OK"
            fi
            sleep 50
          done
          exit 0
